<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">myOS Kernel logo</title>
  <desc id="desc">Three soft concentric arcs orbiting a central point.</desc>
  <defs>
    <linearGradient id="bg" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D86A47"/>
      <stop offset="1" stop-color="#A53A24"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g fill="none" stroke="#FFF" stroke-linecap="round">
    <circle cx="512" cy="512" r="260" stroke-width="84" stroke-dasharray="1190 444" transform="rotate(-38 512 512)"/>
    <circle cx="512" cy="512" r="142" stroke-width="74" stroke-dasharray="655 237" transform="rotate(108 512 512)" opacity=".76"/>
  </g>
  <circle cx="512" cy="512" r="54" fill="#FFF"/>
</svg>
