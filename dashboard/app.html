<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/ui-tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
</head>
<body>
<div class="titlebar"></div>
<div class="app" id="app" data-os-id="panel:shell">
  <nav class="ws-bar" id="ws-bar" aria-label="Workspaces"></nav>
  <aside class="panel side" id="rail" data-os-id="panel:rail"></aside>
  <aside class="panel chat-dock" id="chat-dock" data-os-id="panel:chat">
    <div class="dock-bar">
      <div class="chat-head"><b id="room-title"># hq</b><span class="sm"><span id="chat-title">New thread</span> · <span id="chat-status">Ready</span></span></div>
      <div class="room-members" id="room-members"></div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="term-btn" id="room-edit" title="Edit channel" hidden>✎</button>
        <button class="term-btn" id="chat-list-btn" title="Threads in this channel" data-os-id="btn:global:chat-list">☰</button>
        <button class="term-btn" id="chat-new" title="New thread (old one stays saved)" data-os-id="btn:global:chat-new">+</button>
        <button class="term-btn" id="canvas-toggle" title="Show or hide canvas" data-os-id="btn:global:canvas-toggle">▣</button>
      </div>
    </div>
    <div class="chat-list" id="chat-list" hidden></div>
    <div class="stream" id="chat-stream" data-os-id="fld:global:chat:stream"></div>
    <div class="compose">
      <div class="attachments" id="attachments"></div>
      <div class="ibox">
        <button class="attach-btn" id="attach-btn" title="Skills · web search · attach file (or type / )" data-os-id="btn:global:attach">⊕</button>
        <input type="file" id="file-input" multiple style="display:none">
        <textarea id="chat-input" data-os-id="fld:global:chat:input" placeholder="Message the team… (@ to tag a teammate)" rows="1"></textarea>
        <button class="send" id="chat-send" data-os-id="btn:global:chat-send">↑</button>
      </div>
    </div>
  </aside>
  <div class="right-col" data-os-id="panel:main-col">
    <div class="canvas-resize" id="canvas-resize" title="Drag to resize canvas"></div>
    <nav class="panel canvas-nav" id="canvas-nav" hidden></nav>
    <section class="panel main" id="main" data-os-id="panel:main"><div class="scroll"><div style="padding:30px;color:var(--dim)">loading…</div></div></section>
    <div class="panel term-panel" id="term-panel" data-os-id="panel:terminal">
      <div class="tbar" id="term-tab"><span id="term-chevron">▸</span>&nbsp;Terminal
        <span class="thint">full claude · all skills</span>
        <button class="tclose" id="term-close" title="Toggle terminal" data-os-id="btn:global:terminal-toggle">open ⌃`</button></div>
      <div class="term-mount" id="term"></div>
    </div>
  </div>
</div>
<div id="toast" data-os-id="panel:toast"></div>
<script src="/os-ids.js"></script>
<script src="/post-copy.js"></script>
<script src="/app.js"></script>
</body>
</html>
