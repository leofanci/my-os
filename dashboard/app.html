<div class="titlebar"></div>
<div class="app" id="app" data-os-id="panel:shell">
  <nav class="ws-bar" id="ws-bar" aria-label="Workspaces"></nav>
  <aside class="panel side" id="rail" data-os-id="panel:rail"></aside>
  <aside class="panel chat-dock" id="chat-dock" data-os-id="panel:chat">
    <div class="dock-bar">
      <button class="term-btn" id="nav-toggle" title="Workspaces and channels" aria-label="Open navigation"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <div class="chat-head"><b id="room-title"># hq</b><span class="sm"><span id="chat-title">New thread</span> · <span id="chat-status">Ready</span></span></div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="term-btn" id="room-edit" title="Edit channel" aria-label="Edit channel" hidden><svg class="i" aria-hidden="true"><use href="#i-compose"/></svg></button>
        <button class="term-btn" id="chat-list-btn" title="Threads in this channel" aria-label="Threads" data-os-id="btn:global:chat-list"><svg class="i" aria-hidden="true"><use href="#i-threads"/></svg></button>
        <button class="term-btn" id="chat-new" title="New thread (old one stays saved)" aria-label="New thread" data-os-id="btn:global:chat-new"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button class="term-btn" id="canvas-toggle" title="Show or hide canvas" aria-label="Canvas" data-os-id="btn:global:canvas-toggle"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg></button>
      </div>
    </div>
    <div class="chat-list" id="chat-list" hidden></div>
    <div class="stream" id="chat-stream" data-os-id="fld:global:chat:stream"></div>
    <div class="compose">
      <div class="attachments" id="attachments"></div>
      <div class="ibox">
        <button class="attach-btn" id="attach-btn" title="Skills · web search · attach file (or type / )" aria-label="Skills and attachments" data-os-id="btn:global:attach"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <input type="file" id="file-input" multiple style="display:none">
        <textarea id="chat-input" data-os-id="fld:global:chat:input" placeholder="Message the team… (@ to tag a teammate)" rows="1"></textarea>
        <button class="send" id="chat-send" aria-label="Send" data-os-id="btn:global:chat-send"><svg class="i" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="nav-scrim"></div>
  <div class="right-col" data-os-id="panel:main-col">
    <div class="canvas-resize" id="canvas-resize" title="Drag to resize canvas"></div>
    <nav class="panel canvas-nav" id="canvas-nav" hidden></nav>
    <section class="panel main" id="main" data-os-id="panel:main"><div class="scroll"><div class="empty">loading…</div></div></section>
    <div class="panel term-panel" id="term-panel" data-os-id="panel:terminal">
      <div class="tbar" id="term-tab"><svg class="i term-chevron" aria-hidden="true"><use href="#i-chevron-right"/></svg>&nbsp;Terminal
        <span class="thint">full claude · all skills</span>
        <button class="tclose" id="term-close" title="Toggle terminal" data-os-id="btn:global:terminal-toggle">open ⌃`</button></div>
      <div class="term-mount" id="term"></div>
    </div>
  </div>
</div>
<div id="toast" data-os-id="panel:toast"></div>
<script src="/os-ids.js"></script>
<script src="/post-copy.js"></script>
<script src="/content-view.js"></script>
